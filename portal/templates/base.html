<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16233a">
<title>{% block title %}{{ society_name }} — Online Forms{% endblock %}</title>
<link rel="stylesheet" href="{{ base }}/static/gym.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <div>
      <div class="eyebrow">{{ society_name }}</div>
      <div class="site-title">{% block header_title %}Online Forms{% endblock %}</div>
    </div>
    <div class="header-address">{{ society_address }}</div>
  </div>
</header>

<main class="wrap">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>{{ society_name }} · {{ society_address }}</p>
    <p class="muted">
      <a href="{{ base }}{{ trainer_path }}/rules">Gym rules for trainers</a> ·
      <a href="{{ base }}{{ hall_path }}/rules">Rules for amenity use</a>
    </p>
  </div>
</footer>

</body>
</html>
